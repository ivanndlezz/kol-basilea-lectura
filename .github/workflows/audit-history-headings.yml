name: Audit historical section boundaries against RV1909
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-history-headings.mjs'
      - 'scripts/import-history-sections.mjs'
      - 'scripts/classify-history-sections.mjs'
      - 'scripts/build-history-editorial-review.mjs'
      - 'dist/data/history/timeline.json'
      - '.github/workflows/audit-history-headings.yml'
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch source RV1909 and candidate BSB boundaries
        run: |
          set -euo pipefail
          mkdir -p /tmp/history-audit/rvr1909
          curl --fail --location --retry 3 --silent --show-error 'https://ebible.org/Scriptures/spaRV1909_usfm.zip' -o /tmp/history-audit/rvr1909.zip
          unzip -q /tmp/history-audit/rvr1909.zip -d /tmp/history-audit/rvr1909
          curl --fail --location --retry 3 --silent --show-error 'https://raw.githubusercontent.com/BSB-publishing/bsb-data-output/main/base/headings.jsonl' -o /tmp/history-audit/headings.jsonl
      - name: Convert official RV1909 source
        run: node scripts/convert-usfm.mjs /tmp/history-audit/rvr1909 dist/data/rvr1909 rvr1909 eBible.org
      - name: Compare four pilot books and produce reference-only report
        run: node scripts/audit-history-headings.mjs /tmp/history-audit/headings.jsonl dist/data/rvr1909 reports/history-heading-compatibility.json
      - name: Import and validate four-book section ranges (not published)
        run: node scripts/import-history-sections.mjs /tmp/history-audit/headings.jsonl dist/data/rvr1909 reports/history-sections-pilot.json reports/history-sections-pilot-report.json
      - name: Classify pilot sections as editorial candidates
        run: node scripts/classify-history-sections.mjs reports/history-sections-pilot.json dist/data/history/timeline.json reports/history-sections-classified.json reports/history-classification-report.json
      - name: Prepare source-grounded editorial review sample
        run: node scripts/build-history-editorial-review.mjs reports/history-sections-classified.json reports/history-editorial-review.json reports/history-editorial-review-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-sections-pilot
          path: |
            reports/history-sections-pilot.json
            reports/history-sections-pilot-report.json
            reports/history-sections-classified.json
            reports/history-classification-report.json
            reports/history-editorial-review.json
            reports/history-editorial-review-report.json
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-heading-compatibility
          path: reports/history-heading-compatibility.json
          if-no-files-found: warn
          retention-days: 30
