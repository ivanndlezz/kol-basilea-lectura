name: Build full open Spanish Bible catalog
on:
  push:
    paths:
      - 'scripts/convert-usfm.mjs'
      - 'scripts/build-bibles.mjs'
      - 'dist/data/bible-translations.js'
      - '.github/workflows/build-bible.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Convert and validate 66 books per translation
        run: node scripts/build-bibles.mjs
      - name: Validate generated text and verse counts
        run: node scripts/validate-generated.mjs
      - name: Validate editorial data relationships
        run: npm run validate:data
      - name: Run regression tests
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: open-spanish-bible-json
          path: |
            dist/data/rvr1909/
            dist/data/pdt/
            dist/data/onbv/
            dist/data/bes/
          retention-days: 7
