# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download official open Spanish USFM
        run: |
          set -euo pipefail
          mkdir -p /tmp/kol-basilea-bibles
          curl --fail --location --retry 3 --silent --show-error 'https://ebible.org/Scriptures/spaRV1909_usfm.zip' -o /tmp/kol-basilea-bibles/rvr1909.zip
          curl --fail --location --retry 3 --silent --show-error 'https://ebible.org/Scriptures/spapddpt_usfm.zip' -o /tmp/kol-basilea-bibles/pdt.zip
          curl --fail --location --retry 3 --silent --show-error 'https://ebible.org/Scriptures/spaonbv_usfm.zip' -o /tmp/kol-basilea-bibles/onbv.zip
          curl --fail --location --retry 3 --silent --show-error 'https://ebible.org/Scriptures/spabes_usfm.zip' -o /tmp/kol-basilea-bibles/bes.zip
      - name: Generate 66 Bible JSON files per open translation
        run: |
          set -euo pipefail
          for id in rvr1909 pdt onbv bes; do
            mkdir -p "/tmp/kol-basilea-bibles/$id"
            unzip -q "/tmp/kol-basilea-bibles/$id.zip" -d "/tmp/kol-basilea-bibles/$id"
            node scripts/convert-usfm.mjs "/tmp/kol-basilea-bibles/$id" "dist/data/$id" "$id" "eBible.org"
          done
      - name: Validate generated text and verse counts for every translation
        run: node scripts/validate-generated.mjs
      - name: Validate editorial data relationships
        run: npm run validate:data
      - name: Validate application and Bible
        run: npm run check
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The deployable static app lives in dist/
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
