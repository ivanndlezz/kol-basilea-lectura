name: Source public-domain history images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: history-images
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install Pillow==11.3.0
      - name: Fetch and verify CC0 museum artwork
        run: python scripts/source-history-images.py
      - name: Validate updated editorial data
        run: node scripts/validate-data-integrity.mjs
      - name: Commit verified artwork and credits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/history/timeline.json dist/data/history/image-attributions.json dist/assets/images/history/
          if ! git diff --cached --quiet; then
            git commit -m "assets(history): add verified CC0 museum images and attributions"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
