name: Atlas automatic open-license covers
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum missing cards per run
        required: false
        default: '50'
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths:
      - 'dist/data/history/timeline.json'
      - 'scripts/auto-atlas-covers.py'
permissions:
  contents: write
concurrency:
  group: atlas-covers
  cancel-in-progress: false
jobs:
  covers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Find, validate and import open-license images
        run: python scripts/auto-atlas-covers.py --scope all --limit "${{ inputs.limit || '50' }}"
      - name: Commit imported assets and attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/history/timeline.json dist/assets/images/history
          if ! git diff --cached --quiet; then
            git commit -m "Auto-import licensed Atlas cover images"
            git push
          fi
