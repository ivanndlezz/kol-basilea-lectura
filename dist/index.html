  <body>
    <div id="app"><main class="kb-boot-screen" role="status" aria-live="polite"><span class="kb-boot-mark" aria-hidden="true">✦</span><p>Abriendo Kol Basilea…</p></main></div>
    <script>
      async function recoverReaderCache() {
        const key = "kb-reader-cache-repair-v2";
        if (sessionStorage.getItem(key)) return false;
        sessionStorage.setItem(key, "1");
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.filter(reg => reg.scope.includes("/kol-basilea-lectura/")).map(reg => reg.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.filter(key => key.startsWith("kol-basilea-lectura-")).map(key => caches.delete(key)));
          }
        } catch (error) { console.warn("Cache recovery", error); }
        location.reload();
        return true;
      }
      window.addEventListener("error", async function(event) {
        if (await recoverReaderCache()) return;
        if (!document.querySelector("#app")?.children.length) {
          document.querySelector("#app").innerHTML = '<main style="padding:32px 24px;font-family:system-ui;max-width:520px;margin:12vh auto;color:#20332c"><h1>No pudimos abrir la lectura</h1><p>Es posible que Safari tenga una versión anterior guardada.</p><button onclick="location.reload()" style="background:#245a44;color:white;border:0;border-radius:12px;padding:14px 20px;font-size:16px">Volver a intentar</button></main>';
        }
      });
      window.addEventListener("unhandledrejection", function(event) {
        if (!document.querySelector("#app")?.children.length) window.dispatchEvent(new Event("error"));
      });
      window.setTimeout(function() {
        const app = document.querySelector("#app");
        if (!app?.querySelector(".kb-boot-screen")) return;
        app.innerHTML = '<main class="kb-boot-screen kb-boot-error" role="alert"><span class="kb-boot-mark" aria-hidden="true">!</span><h1>No pudimos abrir la lectura</h1><p>La aplicación está tardando más de lo esperado.</p><button type="button" onclick="location.reload()">Intentar de nuevo</button></main>';
      }, 15000);
    </script>
    <script type="module" src="./app.js?v=20261105-progress-export-v1"></script>
