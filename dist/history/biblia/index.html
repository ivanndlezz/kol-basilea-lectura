t-transform:uppercase}.bible-history-definition dd{margin:0}.bible-history-meta{color:var(--muted);font-size:12px;line-height:1.45;margin-top:11px}.bible-history-list{border-top:3px solid var(--accent);list-style:none;margin:26px 0 0;padding:0}.bible-history-list li{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) 150px;padding:20px 0;border-bottom:1px solid var(--line)}.bible-history-list-tag{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.08em;text-align:right;text-transform:uppercase}.bible-history-communities{display:grid;gap:13px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px}.bible-history-community{background:var(--surface-soft);border:1px solid var(--line);border-radius:20px;padding:20px}.bible-history-community-mark{align-items:center;border:1px solid var(--accent);border-radius:50%;color:var(--accent);display:grid;font-family:Georgia,serif;font-size:23px;height:42px;justify-items:center;margin-bottom:18px;width:42px}.bible-history-cards{display:grid;gap:13px;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:26px}.bible-history-card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:17px;box-shadow:var(--shadow);padding:20px}.bible-history-card-tag{color:var(--gold);font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.bible-history-card h3{margin-top:9px}.bible-history-footer{border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;margin-top:48px;padding-top:25px}.bible-history-footer a{border:1px solid var(--line);border-radius:12px;color:var(--accent);font-size:13px;font-weight:750;padding:11px 14px;text-decoration:none}.bible-history-footer a:hover,.bible-history-footer a:focus-visible{background:var(--accent-soft);border-color:var(--accent)}.bible-history-error{background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--muted);padding:20px}@media(max-width:700px){.bible-history-wrap{padding:27px 14px 70px}.bible-history-header{padding-inline:14px}.bible-history-communities,.bible-history-cards{grid-template-columns:1fr}.bible-history-definition,.bible-history-list li{display:block}.bible-history-definition dd,.bible-history-list-tag{margin-top:9px;text-align:left}.bible-history-step{grid-template-columns:45px minmax(0,1fr);gap:13px}.bible-history-step:before{height:38px;width:38px}.bible-history-step:not(:last-child):after{left:18px;top:59px}.bible-history-section{scroll-margin-top:78px}}

<body>
<header class="bible-history-header"><a href="../">‹ Historia · Kol Basilea</a></header>
<main class="bible-history-wrap">
  <section class="bible-history-hero" aria-labelledby="bible-history-title">
    <div class="bible-history-eyebrow">Historia de la Escritura</div>
    <h1 id="bible-history-title">Historia de la Biblia</h1>
    <p id="bible-history-intro" class="bible-history-intro"></p>
    <p id="bible-history-note" class="bible-history-note"></p>
  </section>
  <nav id="bible-history-index" class="bible-history-index" aria-label="Secciones de Historia de la Biblia"></nav>
  <div id="bible-history-sections" aria-live="polite"></div>

</main>
<script type="module">
const root=document.documentElement;
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
const sectionLabel=section=>section.eyebrow||section.title;
const renderTimeline=section=>'<ol class="bible-history-steps">'+section.items.map(item=>'<li class="bible-history-step"><div><span class="bible-history-period">'+esc(item.period)+'</span><h3>'+esc(item.title)+'</h3><p>'+esc(item.text)+'</p><div class="bible-history-reference">'+esc(item.reference)+'</div></div></li>').join("")+'</ol>';
const renderDefinitions=section=>'<dl class="bible-history-definitions">'+section.items.map(item=>'<div class="bible-history-definition"><dt>'+esc(item.term)+'<small>'+esc(item.label)+'</small></dt><dd><p>'+esc(item.text)+'</p><div class="bible-history-meta">'+esc(item.meta)+'</div></dd></div>').join("")+'</dl>';
const renderList=section=>'<ul class="bible-history-list">'+section.items.map(item=>'<li><div><h3>'+esc(item.title)+'</h3><p>'+esc(item.text)+'</p></div><span class="bible-history-list-tag">'+esc(item.tag)+'</span></li>').join("")+'</ul>';
const renderCommunities=section=>'<div class="bible-history-communities">'+section.items.map(item=>'<article class="bible-history-community"><div class="bible-history-community-mark" aria-hidden="true">'+esc(item.mark)+'</div><h3>'+esc(item.title)+'</h3><p>'+esc(item.text)+'</p></article>').join("")+'</div>';
const renderCards=section=>'<div class="bible-history-cards">'+section.items.map(item=>'<article class="bible-history-card"><span class="bible-history-card-tag">'+esc(item.tag)+'</span><h3>'+esc(item.title)+'</h3><p>'+esc(item.text)+'</p></article>').join("")+'</div>';
const renderBody=section=>({timeline:renderTimeline,definitions:renderDefinitions,list:renderList,communities:renderCommunities,cards:renderCards}[section.layout]||renderList)(section);
const renderSection=section=>'<section class="bible-history-section" id="'+esc(section.id)+'" aria-labelledby="'+esc(section.id)+'-title"><div class="bible-history-section-head"><div class="bible-history-section-kicker">'+esc(section.eyebrow)+'</div><h2 id="'+esc(section.id)+'-title">'+esc(section.title)+'</h2><p class="bible-history-section-intro">'+esc(section.intro)+'</p></div>'+renderBody(section)+'</section>';
function syncTheme(){let choice="system";try{const saved=JSON.parse(localStorage.getItem("kol-basilea-lectura-v1")||"{}");if(["system","light","dark"].includes(saved.appAppearance))choice=saved.appAppearance}catch{}const dark=choice==="dark"||(choice==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);root.dataset.kbBibleHistoryTheme=dark?"dark":"light";root.style.colorScheme=dark?"dark":"light";document.querySelector('meta[name="theme-color"]')?.setAttribute("content",dark?"#101a15":"#f6f7f4")}
syncTheme();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",syncTheme);window.addEventListener("storage",event=>{if(event.key==="kol-basilea-lectura-v1")syncTheme()});
const sectionsRoot=document.querySelector("#bible-history-sections"),indexRoot=document.querySelector("#bible-history-index");
fetch("../../data/history/bible-history.json?v=20261103-bible-history-v1").then(response=>{if(!response.ok)throw new Error("HTTP "+response.status);return response.json()}).then(data=>{document.title=data.title+" · Kol Basilea";document.querySelector("#bible-history-intro").textContent=data.intro;document.querySelector("#bible-history-note").textContent=data.note;indexRoot.innerHTML=data.sections.map(section=>'<a href="#'+esc(section.id)+'">'+esc(sectionLabel(section))+'</a>').join("");sectionsRoot.innerHTML=data.sections.map(renderSection).join("")}).catch(()=>{sectionsRoot.innerHTML='<p class="bible-history-error">No pudimos cargar esta sección. Intenta actualizar la página.</p>'});
</script>
</body>
